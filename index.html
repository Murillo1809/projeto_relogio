
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Site</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>Meu primeiro site com JavaScript</h1>
    </header>

    <main>
        <div class="bloco">
            <h2>Horario atual</h2>
            <p id="horario">Carregando...</p>
        </div>

        <div class="bloco">
            <h2>Entrada no evento</h2>
            <input type="number" id="idade" placeholder="Digite sua idade" min="0">
            <button id="verificar">Verificar idade</button>
            <p id="resultado"></p>
        </div>

        <div class="bloco">
            <h2>Aparencia do site</h2>
            <button id="mudarTema">Mudar tema</button>
        </div>
    </main>

</body>
</html>
